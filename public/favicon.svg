<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#3c4043" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- App Icon Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#FFFFFF" filter="url(#appShadow)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" fill="none" stroke="#E8EAED" stroke-width="1"/>

  <!-- MinGraph 6 Network Edges -->
  <line x1="36" y1="36" x2="36" y2="92" stroke="#B8D3FB" stroke-width="7" stroke-linecap="round"/>
  <line x1="92" y1="36" x2="92" y2="92" stroke="#B8D3FB" stroke-width="7" stroke-linecap="round"/>
  <line x1="36" y1="36" x2="64" y2="64" stroke="#B8D3FB" stroke-width="7" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="92" y2="36" stroke="#B8D3FB" stroke-width="7" stroke-linecap="round"/>
  <line x1="36" y1="92" x2="64" y2="64" stroke="#B8D3FB" stroke-width="7" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="92" y2="92" stroke="#B8D3FB" stroke-width="7" stroke-linecap="round"/>

  <!-- 5 Nodes in Google Colors -->
  <circle cx="36" cy="36" r="13" fill="#4285F4"/>
  <circle cx="92" cy="36" r="13" fill="#EA4335"/>
  <circle cx="64" cy="64" r="13" fill="#FBBC04"/>
  <circle cx="36" cy="92" r="13" fill="#34A853"/>
  <circle cx="92" cy="92" r="13" fill="#4285F4"/>
</svg>